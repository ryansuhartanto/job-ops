name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.12
      - name: Run Biome
        run: biome ci .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun ci
        working-directory: .
      - name: Run Tests
        run: bun run test:all
        working-directory: .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - job-ops-orchestrator
          - adzuna-extractor
          - hiringcafe-extractor
          - gradcracker-extractor
          - startupjobs-extractor
          - workingnomads-extractor
          - ukvisajobs-extractor
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci
        working-directory: .

      - name: Check shared package types
        run: bun run check:types:shared
        working-directory: .

      - name: Type Check ${{ matrix.project }}
        run: bun run --filter '${{ matrix.project }}' check:types
        working-directory: .

      - name: Build ${{ matrix.project }} (client)
        if: matrix.project == 'job-ops-orchestrator'
        run: bun run --filter 'job-ops-orchestrator' build:client
        working-directory: .

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci
        working-directory: .

      - name: Build documentation site
        run: bun run check:docs
        working-directory: .
